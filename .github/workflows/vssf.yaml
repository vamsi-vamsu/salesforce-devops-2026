name: "Salesforce pipeline"
run-name: "Salesforce Pipeline run"

on:
  push:
env:
 DEV_ORG: Dev
 NODE_VERSION: ">=20.9.0"

jobs:
  Setup-salesforce:
    name: "Setup-salesforce"
    runs-on: ubuntu-latest

    steps:
      - name: "checkout"
        run: |
          echo Nodeversion: $NODE_VERSION
          echo Org_name: $DEV_ORG

      - name: "checkout"
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
      

        # PREREQUISITES - Only needed if the runner doesn't already satisfy these requirements.
      - name: Ensure node v20.9.0 or greater
        uses: actions/setup-node@v5
        with:
          node-version: ${{env.NODE_VERSION}}
      - name: Ensure java v11 or greater
        uses: actions/setup-java@v5
        with:
          java-version: '>=11'
          distribution: 'zulu'
      - name: Ensure python v3.10 or greater
        uses: actions/setup-python@v6
        with:
          python-version: '>=3.10'

      - name: "Setup Salesforce Cli"
        run: npm install --global @salesforce/cli@latest

      - name: "Check sf cli version"
        run: sf --version

      - name: Run Salesforce Code Analyzer
        id: run-code-analyzer
        uses: forcedotcom/run-code-analyzer@v2
        with:
          run-arguments: --workspace . --view detail --output-file sfca_results.html --output-file sfca_results.json
          results-artifact-name: salesforce-code-analyzer-results
          github-token: ${{ github.token }}

      - name: "authenticate with salesforce"
        run: |
          echo ${{secrets.DEV_AUTH_URL}} > auth.txt
          sf org login sfdx-url --sfdx-url-file auth.txt --set-default --alias $DEV_ORG
          rm auth.txt

      - name: "deploy to  Dev"
        run: sf project deploy start --source-dir force-app/main/default -o $DEV_ORG --wait 45

      - name: "Assign ps"
        run: sf org assign permset --name Onboarding_Manager --on-behalf-of $DEV_ORG -o $DEV_ORG --wait 5


